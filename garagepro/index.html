<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GaragePro — Workshop Manager</title>
<meta name="theme-color" content="#0f172a">
<meta name="description" content="GaragePro — auto repair workshop management: job cards, quotations, invoices, vehicle history, stock and finance.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GaragePro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23f97316'/><path d='M8 20l3-8h10l3 8v4h-3v-2H11v2H8z' fill='white'/></svg>">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand" onclick="go('#/dashboard')">
      <div class="brand-logo" id="brandLogo">GP</div>
      <div><div class="brand-name" id="brandName">GaragePro</div><div class="brand-sub">Workshop Manager</div></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot"><span id="backupHint"></span></div>
  </aside>
  <div id="main">
    <header id="topbar">
      <button class="icon-btn only-mobile" onclick="document.body.classList.toggle('nav-open')" aria-label="Menu">☰</button>
      <div class="search-wrap">
        <span class="search-ico">⌕</span>
        <input id="globalSearch" type="search" autocomplete="off" placeholder="Enter number plate or VIN — or search customer, phone, invoice no.  ( / )"
          onkeydown="if(event.key==='Enter'){doGlobalSearch(this.value)}">
      </div>
      <button class="btn" onclick="printView()" title="Print this screen (or Save as PDF)">🖨 Print</button>
      <span id="previewTag" class="preview-tag" hidden title="Preview: separate test data, cloud sync off">PREVIEW</span>
      <button class="btn" onclick="newMobileJob()" id="tbMobile">🚐 Mobile request</button>
      <button class="btn primary" onclick="go('#/checkin')">＋ Check-in vehicle</button>
    </header>
    <section id="view"></section>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toast"></div>
<div id="printRoot"></div>

<nav id="bottomNav"></nav>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="lib/qrcode.min.js"></script>
<script src="js/icon-paths.js"></script>
<script src="js/icons.js"></script>
<script src="js/ui.js"></script>
<script src="js/documents.js"></script>
<script src="js/share.js"></script>
<script src="js/pages-main.js"></script>
<script src="js/pages-docs.js"></script>
<script src="js/pages-stock.js"></script>
<script src="js/pages-admin.js"></script>
<script src="js/photos.js"></script>
<script src="js/prints.js"></script>
<script src="js/finance.js"></script>
<script src="js/pro.js"></script>
<script src="js/mobile.js"></script>
<script src="js/requests.js"></script>
<script src="js/auth.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
