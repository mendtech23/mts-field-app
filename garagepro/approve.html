<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your quotation — mendtech.</title>
<meta name="description" content="Review and approve your quotation from mendtech.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#122036">
<link rel="icon" href="img/brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face { font-family: 'Inter'; font-weight: 400; font-display: swap; src: url(fonts/inter-400.woff2) format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 500 600; font-display: swap; src: url(fonts/inter-600.woff2) format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 700 900; font-display: swap; src: url(fonts/inter-700.woff2) format('woff2'); }
@font-face { font-family: 'Space Grotesk'; font-weight: 700; font-display: swap; src: url(fonts/space-grotesk-700.woff2) format('woff2'); }
/* mendtech. brand: navy #122036 · steel #9AA3B5 · gold #C9A227 · orange #D97A2B */
:root { --bg:#f3f5f8; --card:#fff; --ink:#122036; --ink2:#4b5265; --ink3:#9aa3b5; --line:#dee3e9; --line2:#c7ccd9; --acc:#122036; --accInk:#fff; --hl:#c9a227; --soft:#fbf7e9; --red:#dc2626; --green:#16a34a; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg:#0b1220; --card:#111a2c; --ink:#e5e7eb; --ink2:#9aa7bd; --ink3:#64748b; --line:#1f2a3d; --line2:#2c3a52; --soft:#2a2410; --acc:#c9a227; --accInk:#122036; --red:#f87171; --green:#4ade80; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Inter', "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; background: var(--bg); color: var(--ink); font-size: 15px; }
.wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
header { padding: 10px 0 14px; }
.blogo { display: block; width: 170px; height: auto; }
.blogo.dark { display: none; }
@media (prefers-color-scheme: dark) { .blogo.light { display: none; } .blogo.dark { display: block; } }
.brule { display: flex; height: 4px; margin: 14px 0 12px; background: var(--line); border-radius: 2px; overflow: hidden; }
.brule i { width: 48px; background: #c9a227; } .brule i + i { background: #d97a2b; }
h1 { font-family: 'Space Grotesk', 'Inter', sans-serif; font-size: 22px; margin: 0; letter-spacing: .01em; } .sub { color: var(--ink2); font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.card h2 { font-size: 15px; margin: 0 0 10px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice { border: 1.5px solid var(--line2); border-radius: 12px; padding: 14px 10px; text-align: center; cursor: pointer; background: var(--card); color: var(--ink); font: inherit; }
.choice b { display: block; font-size: 15px; margin-top: 4px; } .choice span { font-size: 12px; color: var(--ink2); }
.choice.on { border-color: var(--hl); background: var(--soft); box-shadow: 0 0 0 2px var(--hl) inset; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line2); border-radius: 99px; padding: 8px 12px; cursor: pointer; background: var(--card); color: var(--ink); font: inherit; font-size: 13.5px; }
.chip.on { background: var(--acc); border-color: var(--acc); color: var(--accInk); }
label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink2); margin: 10px 0 4px; }
input, select, textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--line2); border-radius: 10px; font: inherit; background: var(--card); color: var(--ink); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--hl); box-shadow: 0 0 0 3px rgba(201,162,39,.25); }
textarea { min-height: 80px; resize: vertical; }
.btn { width: 100%; border: 0; border-radius: 12px; padding: 15px; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; background: var(--acc); color: var(--accInk); }
.btn:active { transform: scale(.99); } .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line2); font-weight: 600; }
.btn.wa { background: #25d366; }
.loc { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
.loc button { flex: none; width: auto; padding: 10px 14px; font-size: 14px; }
.ok { color: var(--green); font-size: 13px; } .err { color: var(--red); font-size: 13px; margin-top: 6px; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.consent { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--ink2); margin-top: 12px; }
.consent input { width: auto; margin-top: 2px; }
.hidden { display: none; }
.done { text-align: center; padding: 30px 10px; }
.done .tick { width: 70px; height: 70px; border-radius: 50%; background: var(--green); color: #fff; font-size: 38px; display: grid; place-items: center; margin: 0 auto 12px; }
.ref { font-family: Consolas, monospace; font-size: 18px; font-weight: 700; background: var(--soft); padding: 6px 12px; border-radius: 8px; display: inline-block; margin: 8px 0; }
.foot { text-align: center; font-size: 12px; color: var(--ink3); margin-top: 20px; }
.banner { background: #fef3c7; color: #92400e; border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
/* quotation approval page (v3.4) */
.qmeta { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13.5px; } .qmeta dt { color: var(--ink2); } .qmeta dd { margin: 0; font-weight: 600; }
table.qi { width: 100%; border-collapse: collapse; font-size: 13.5px; } .qi th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); border-bottom: 1px solid var(--line2); padding: 6px 4px; }
.qi td { padding: 8px 4px; border-bottom: 1px solid var(--line); vertical-align: top; } .qi .n { text-align: right; white-space: nowrap; }
.tot { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; margin-top: 10px; } .tot .n { text-align: right; } .tot .big { font-size: 20px; font-weight: 800; border-top: 2px solid var(--ink); padding-top: 8px; margin-top: 4px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.btn.ok2 { background: var(--green); color: #fff; } .btn.no { background: transparent; color: var(--red); border: 1px solid var(--line2); font-weight: 600; }
.status { border-radius: 12px; padding: 14px; text-align: center; font-weight: 600; } .status.g { background: #dcfce7; color: #166534; } .status.r { background: #fee2e2; color: #991b1b; } .status.a { background: #fef3c7; color: #92400e; }
.terms { font-size: 12px; color: var(--ink2); white-space: pre-wrap; }
.muted { color: var(--ink2); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header><img class="blogo light" src="img/brand/logo.svg" alt="mendtech. auto · mobile"><img class="blogo dark" src="img/brand/logo-reverse.svg" alt=""><div class="brule"><i></i><i></i></div></header>
  <div id="app"><div class="card muted">Loading your quotation…</div></div>
  <div class="foot">Secure link for you only — please don't forward it.</div>
</div>
<script src="js/config.js"></script>
<script src="js/approve.js"></script>
</body>
</html>
